<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Old Tbilisi — a walking sketchbook</title>
<style>
:root{--paper:#f6eedb;--ink:#2b2622;--red:#b5432f;--blue:#2f5f86;--hand:"Noteworthy","Bradley Hand","Segoe Print","Ink Free","Comic Sans MS",cursive;--serif:Georgia,"Iowan Old Style","Times New Roman",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#efe6d0;color:var(--ink);font-family:var(--serif);overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
.ink{background:var(--paper);border:2px solid var(--ink);border-radius:255px 18px 225px 18px/18px 225px 18px 255px;box-shadow:2px 3px 0 rgba(43,38,34,.18)}
#title{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(246,238,219,.93) 0%,rgba(246,238,219,.80) 55%,rgba(246,238,219,.35) 100%);transition:opacity .9s;z-index:20;padding:20px;text-align:center}
#title.off{opacity:0;pointer-events:none}
#title h1{font-family:var(--hand);font-size:clamp(40px,9vw,92px);margin:0;line-height:1;letter-spacing:1px}
#title h2{font-size:clamp(17px,3.2vw,28px);font-weight:400;margin:.35em 0 0;color:#5a4a40}
#title .ka{font-size:clamp(15px,2.4vw,22px);color:var(--red);margin-top:.5em}
#title p{max-width:34em;margin:1.2em auto 0;font-size:clamp(14px,2vw,17px);line-height:1.5}
#start{margin-top:1.4em;padding:.55em 1.6em;font-family:var(--hand);font-size:clamp(20px,3.4vw,30px)}
#start:disabled{opacity:.55;cursor:default}
#start:not(:disabled):hover{background:#fff7e2}
#loadmsg{height:1.4em;margin-top:.9em;font-style:italic;color:#6b5a4e}
#credit{margin-top:1.6em;font-size:12.5px;color:#5a4a40;line-height:1.5}
#credit a{color:inherit}
#hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .8s;z-index:10}
#hud.on{opacity:1}
#where{position:absolute;left:calc(14px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));padding:7px 16px 8px;max-width:min(58vw,calc(100vw - 640px))}
#sen{font-family:var(--hand);font-size:clamp(17px,2.6vw,24px);line-height:1.15}
#ska2{font-size:13px;color:#6b5a4e}
#clock{font-size:12.5px;color:#6b5a4e;margin-top:2px;font-variant-numeric:tabular-nums}
#tools{position:absolute;right:calc(12px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));display:flex;gap:8px;align-items:flex-start;justify-content:flex-end;flex-wrap:wrap;max-width:620px;pointer-events:auto}
#tools button{padding:6px 12px 7px;font-family:var(--hand);font-size:17px;min-width:44px;min-height:40px}
#tools button:hover{background:#fff7e2}
#mini{position:absolute;right:calc(14px + env(safe-area-inset-right));top:calc(64px + env(safe-area-inset-top));width:132px;height:132px;border-radius:50%;border:2px solid var(--ink);box-shadow:2px 3px 0 rgba(43,38,34,.18);pointer-events:auto;cursor:pointer}
#prompt,#toast{position:absolute;left:50%;transform:translateX(-50%);padding:8px 20px 9px;opacity:0;transition:opacity .35s;text-align:center;max-width:86vw}
#prompt{bottom:calc(86px + env(safe-area-inset-bottom));font-family:var(--hand);font-size:19px}
#toast{bottom:calc(30px + env(safe-area-inset-bottom));font-size:15.5px;line-height:1.35}
#prompt.on,#toast.on{opacity:1}
#act{position:absolute;right:calc(26px + env(safe-area-inset-right));bottom:calc(96px + env(safe-area-inset-bottom));width:74px;height:74px;border-radius:50%;font-family:var(--hand);font-size:17px;display:none;pointer-events:auto}
@media (pointer:coarse){#act.on{display:block}#prompt{bottom:calc(180px + env(safe-area-inset-bottom))}}
#stick{position:absolute;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;border:2px dashed rgba(43,38,34,.55);background:rgba(246,238,219,.35);display:none}
#stick.on{display:block}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:rgba(43,38,34,.55)}
#mark{position:absolute;margin:-13px 0 0 -9px;font-family:var(--hand);font-size:24px;color:var(--red);display:none;text-shadow:0 0 3px #fff}
#mark.on{display:block}
#stamp{position:absolute;left:50%;top:17%;transform:translate(-50%,-30px) rotate(-3deg) scale(1.25);opacity:0;padding:12px 16px 12px;display:flex;gap:14px;align-items:center;pointer-events:none;max-width:92vw}
#stamp.on{opacity:1;transform:translate(-50%,0) rotate(-3deg) scale(1);transition:transform .28s cubic-bezier(.3,1.7,.5,1),opacity .2s;pointer-events:auto;cursor:pointer}
#sthumb{width:150px;height:100px;border:1.5px solid var(--ink);background:#efe4c9;flex:none}
#sthumb canvas{width:100%;height:100%;display:block}
#stamp small{display:block;font-size:11px;letter-spacing:3px;color:var(--red);font-weight:700}
#stitle{font-family:var(--hand);font-size:clamp(20px,3.4vw,30px);line-height:1.1}
#ska{font-size:14px;color:#6b5a4e}
.panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(60,50,40,.35);z-index:30;padding:14px;pointer-events:auto}
.panel.on{display:flex}
.book{background:var(--paper);border:2px solid var(--ink);border-radius:14px 22px 16px 24px;box-shadow:4px 6px 0 rgba(43,38,34,.25);max-width:min(980px,100%);max-height:100%;width:100%;display:flex;flex-direction:column;overflow:hidden;position:relative}
.book header{padding:14px 56px 8px 22px;border-bottom:1.5px dashed rgba(43,38,34,.4)}
.book h2{font-family:var(--hand);font-size:clamp(24px,4vw,34px);margin:0}
.close{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font-size:18px}
#jstats{font-size:14px;margin-top:4px;color:#5a4a40}
.scroll{overflow:auto;padding:14px 20px 22px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#jlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{display:flex;gap:12px;padding:10px;border:1.5px solid rgba(43,38,34,.55);border-radius:6px 12px 8px 14px;background:#fbf5e4}
.card.unk{opacity:.55}
.thumb{width:132px;height:88px;flex:none;border:1.5px solid var(--ink);background:#efe4c9;transform:rotate(-1.5deg)}
.thumb canvas{width:100%;height:100%;display:block}
.thumb.q{display:flex;align-items:center;justify-content:center;font-family:var(--hand);font-size:44px;color:#9a8a78}
.card h3{font-family:var(--hand);font-size:20px;margin:0;line-height:1.1}
.card .ka{font-size:12.5px;color:var(--red);margin:2px 0 4px}
.card p{font-size:13.5px;line-height:1.42;margin:0}
h4{font-family:var(--hand);font-size:20px;margin:18px 0 6px}
.err{font-size:14.5px;padding:2px 0}.err.done{color:#5d7a4a}
#map .book{width:auto;padding:10px;align-items:center}
#mapc{max-width:100%;max-height:calc(100vh - 80px);border:1.5px solid var(--ink);border-radius:4px}
#map .cr{font-size:11.5px;color:#5a4a40;margin-top:6px}
#mapHint{font-family:var(--hand);font-size:17px;color:var(--red);margin:0 44px 6px 0}#mapHint:empty{display:none}
#chSub{font-size:13.5px;color:#5a4a40;margin-top:3px}
#chIn{display:block;width:100%;margin:0 0 12px;padding:8px 14px;font-family:var(--hand);font-size:24px;letter-spacing:6px;text-transform:uppercase;text-align:center;color:var(--ink);background:#fffaf0;border:2px solid var(--ink);border-radius:255px 18px 225px 18px/18px 225px 18px 255px;outline:none}
#chT{border-collapse:collapse;width:100%}#chT tr{cursor:pointer}#chT tr:hover{background:#fff7e2}#chT td{padding:6px 10px 6px 4px;font-size:14.5px;vertical-align:middle;border-bottom:1px dashed rgba(43,38,34,.25)}
#chT td:first-child{font-family:var(--hand);font-size:19px;letter-spacing:2px;white-space:nowrap}#chT td:last-child{text-align:right;white-space:nowrap;font-size:12px;letter-spacing:1px;color:#8a7a6a}#chT tr.on td:last-child{color:var(--red);font-weight:700}
#help table{border-collapse:collapse;font-size:15px}#help td{padding:4px 14px 4px 0;vertical-align:top}#help td:first-child{font-family:var(--hand);white-space:nowrap}
#tLang{margin-top:.8em;padding:4px 16px 5px;font-size:15px}
#stampHint{font-size:12px;color:#6b5a4e;margin-top:3px;font-style:italic}
.card.has{cursor:pointer}.card.has:hover{background:#fff7e2}
#sight{position:fixed;right:calc(16px + env(safe-area-inset-right));top:50%;transform:translate(120%,-50%);width:min(360px,42vw);max-height:86vh;overflow:auto;padding:16px 20px 18px;z-index:22;transition:transform .45s cubic-bezier(.2,.9,.3,1);pointer-events:auto;border-radius:14px 22px 16px 24px}
#sight.on{transform:translate(0,-50%)}
#sight small{font-size:11px;letter-spacing:3px;color:var(--red);font-weight:700}
#gtitle{font-family:var(--hand);font-size:clamp(24px,3vw,34px);line-height:1.1;margin-top:2px}
#galt{font-size:14px;color:var(--red);margin:3px 0 10px}
#gthumb{border:1.5px solid var(--ink);background:#efe4c9;transform:rotate(-1.2deg);aspect-ratio:3/2}
#gthumb canvas{width:100%;height:100%;display:block}
#gnote{font-size:15.5px;line-height:1.5;margin:12px 0 14px}
#gback{padding:6px 18px 7px;font-family:var(--hand);font-size:18px;background:#fff7e2}
#hud.sighting #mini,#hud.sighting #where,#hud.sighting #tools,#hud.sighting #stamp,#hud.sighting #prompt,#hud.sighting #mark,#hud.sighting #toast{opacity:0;pointer-events:none}
@media (max-width:700px){#sight{right:8px;left:8px;width:auto;top:auto;bottom:calc(8px + env(safe-area-inset-bottom));max-height:46vh;transform:translate(0,120%)}#sight.on{transform:none}#gthumb{display:none}#gnote{font-size:14.5px}}
#dialog{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(620px,94vw);padding:14px 20px 14px;display:none;z-index:25;pointer-events:auto}
#dialog.on{display:block}
#dname{font-family:var(--hand);font-size:20px;color:var(--red)}
#dtext{font-size:16.5px;line-height:1.45;margin:6px 0 12px}
#dbtns{display:flex;gap:10px;justify-content:flex-end}
#dbtns button{padding:5px 18px 6px;font-family:var(--hand);font-size:18px;background:#fff7e2;border:2px solid var(--ink);border-radius:255px 18px 225px 18px/18px 225px 18px 255px}
@media (max-width:900px){#tools{max-width:300px}#where{max-width:calc(100vw - 330px)}}
@media (max-width:640px){#mini{width:96px;height:96px}#tools{max-width:190px;gap:6px}#where{max-width:calc(100vw - 215px)}#tools button{padding:5px 9px;font-size:15px}#jlist{grid-template-columns:1fr}.thumb{width:104px;height:70px}#sthumb{width:108px;height:72px}}
@media (max-height:520px){#mini{width:92px;height:92px}#stamp{max-width:calc(100vw - 240px);padding:8px 12px}#sthumb{width:96px;height:64px}#toast{bottom:calc(12px + env(safe-area-inset-bottom));font-size:14px}#prompt{bottom:calc(58px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="where" class="ink"><div id="sen">Old Tbilisi</div><div id="ska2"></div><div id="clock">08:00</div></div>
  <div id="tools">
    <button id="btnT" class="ink" title="T">hours ▸▸</button>
    <button id="btnJ" class="ink" title="J"><span id="lblJ">Journal</span> <span id="count"></span></button>
    <button id="btnM" class="ink" title="M">Map</button>
    <button id="btnC" class="ink" title="C">Cheats</button>
    <button id="btnL" class="ink" title="English / ქართული">ქართული</button>
    <button id="btnH" class="ink" title="H">?</button>
  </div>
  <canvas id="mini" width="264" height="264" onclick="document.getElementById('btnM').click()"></canvas>
  <div id="mark">✕</div>
  <div id="stamp" class="ink"><div id="sthumb"></div><div><small id="stampS">SKETCHED</small><div id="stitle"></div><div id="ska"></div><div id="stampHint">tap to look around</div></div></div>
  <div id="prompt" class="ink"></div>
  <div id="toast" class="ink"></div>
  <div id="stick"><div id="knob"></div></div>
  <button id="act" class="ink">Go</button>
</div>
<div id="sight" class="ink"><small id="gsmall">SKETCHED</small><div id="gtitle"></div><div id="galt"></div><div id="gthumb"></div><p id="gnote"></p><button id="gback" class="ink">Back to the walk</button></div>
<div id="dialog" class="ink"><div id="dname"></div><div id="dtext"></div><div id="dbtns"></div></div>
<div id="journal" class="panel"><div class="book"><button class="close">✕</button>
  <header><h2 id="jH2">Sketchbook</h2><div id="jstats"></div></header>
  <div class="scroll"><div id="jlist"></div><h4 id="jErrH">Errands</h4><div id="jerr"></div></div></div></div>
<div id="map" class="panel"><div class="book"><button class="close">✕</button><div class="cr" id="mapHint"></div><canvas id="mapc"></canvas>
  <div class="cr" id="mapCr">Map data © OpenStreetMap contributors</div></div></div>
<div id="cheats" class="panel"><div class="book" style="max-width:620px"><button class="close">✕</button>
  <header><h2 id="chH2">Cheat codes</h2><div id="chSub"></div></header>
  <div class="scroll"><input id="chIn" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12" placeholder="· · · · · ·"><table id="chT"></table></div></div></div>
<div id="help" class="panel"><div class="book" style="max-width:560px"><button class="close">✕</button>
  <header><h2 id="helpH2">How to walk</h2></header><div class="scroll"><table id="helpT"></table><p id="helpP" style="font-size:14.5px;line-height:1.5"></p></div></div></div>
<div id="title"><div>
  <h1 id="tH1">Old Tbilisi</h1>
  <div class="ka" id="tKa">ძველი თბილისი</div>
  <h2 id="tH2">a walking sketchbook</h2>
  <p id="tIntro"></p>
  <button id="start" class="ink" disabled>Opening the sketchbook…</button>
  <div><button id="tLang" class="ink">ქართული</button></div>
  <div id="loadmsg"></div>
  <div id="credit"><span id="tCredit">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>, ODbL.</span></div>
</div></div>
<script>

async function startGame(W, world) {

  const sst = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

  const nn = (n) => LANG === 'ka' ? KA.npc[n.id][0] : n.name, ni = (n) => LANG === 'ka' ? KA.npc[n.id][1] : n.idle, ef = (e, k) => LANG === 'ka' ? KA.er[e.id][k] : e[k];

    return (gh[o] * (1 - u) + gh[o + 1] * u) * (1 - v) + (gh[o + G] * (1 - u) + gh[o + G + 1] * u) * v; };
  const wk = (x, z) => (x < 1 || z < 1 || x > S - 1 || z > S - 1) ? 0 : walk[((z / TX) | 0) * G + ((x / TX) | 0)];
  const topAt = (x, z) => top[clamp((z / TX) | 0, 0, G - 1) * G + clamp((x / TX) | 0, 0, G - 1)];

  // ---------------------------------------------------------------- navigation grid, reachability, A*
  const NS = G > 1024 ? 2 : 1, NG = G / NS, NC = S / NG;
  const nav = new Uint8Array(NG * NG), navH = new Float32Array(NG * NG);
  // every texel under a cell must be walkable, so a cell centre is always a place one can stand
  for (let j = 0; j < NG; j++) for (let i = 0; i < NG; i++) { let c = 0;
    for (let b = 0; b < NS; b++) for (let a = 0; a < NS; a++) c += walk[(j * NS + b) * G + i * NS + a];
    nav[j * NG + i] = c === NS * NS ? 1 : 0; navH[j * NG + i] = gy((i + 0.5) * NC, (j + 0.5) * NC); }

  const stepOK = (a, b, k) => Math.abs(navH[a] - navH[b]) <= 2.2 * NC * DC[k];
  const reach = new Uint8Array(NG * NG);
  function flood(start, mark) { const q = new Int32Array(NG * NG); let h = 0, t = 0, n = 0; if (!nav[start] || reach[start]) return 0; q[t++] = start; reach[start] = mark;
    while (h < t) { const c = q[h++], ci = c % NG, cj = (c / NG) | 0; n++;
      for (let k = 0; k < 4; k++) { const ni = ci + DI[k], nj = cj + DJ[k]; if (ni < 0 || nj < 0 || ni >= NG || nj >= NG) continue; const m = nj * NG + ni;
        if (nav[m] && !reach[m] && stepOK(c, m, k)) { reach[m] = mark; q[t++] = m; } } } return n; }
  function nearest(x, z, maxR, needReach) { const ci = clamp((x / NC) | 0, 0, NG - 1), cj = clamp((z / NC) | 0, 0, NG - 1), RM = Math.ceil(maxR / NC); let best = -1, bd = 1e9;
    for (let r = 0; r <= RM && (best < 0 || r * NC < bd + NC); r++) for (let dj = -r; dj <= r; dj++) for (let di = -r; di <= r; di++) {
      if (Math.max(Math.abs(di), Math.abs(dj)) !== r) continue; const i = ci + di, j = cj + dj; if (i < 0 || j < 0 || i >= NG || j >= NG) continue;

  function findPath(sx, sz, tx, tz, limit) {
    const s = cellOf(sx, sz), t = cellOf(tx, tz); if (s === t) return [[tx, tz]]; if (!nav[t]) return null;
    stampN++; const heap = [], hf = []; const ti = t % NG, tj = (t / NG) | 0;
    const push = (c, f) => { let i = heap.length; heap.push(c); hf.push(f); while (i > 0) { const p = (i - 1) >> 1; if (hf[p] <= f) break; heap[i] = heap[p]; hf[i] = hf[p]; i = p; } heap[i] = c; hf[i] = f; };
    const pop = () => { const topc = heap[0], c = heap.pop(), f = hf.pop(); const n = heap.length; if (n) { let i = 0; for (;;) { let k = 2 * i + 1; if (k >= n) break; if (k + 1 < n && hf[k + 1] < hf[k]) k++; if (hf[k] >= f) break; heap[i] = heap[k]; hf[i] = hf[k]; i = k; } heap[i] = c; hf[i] = f; } return topc; };
    const hh = (c) => { const dx = Math.abs(c % NG - ti), dy = Math.abs(((c / NG) | 0) - tj); return Math.max(dx, dy) + 0.4142 * Math.min(dx, dy); };

        const ng = g + DC[k]; if (stamp[m] === stampN && gS[m] <= ng) continue; stamp[m] = stampN; gS[m] = ng; came[m] = c; push(m, ng + hh(m)); } }

  }

  // ---------------------------------------------------------------- start point and what can be reached on foot
  const startC = nearest(LM.freedom.x + 15, LM.freedom.z - 12, 60, false);
  flood(cellOf(startC.x, startC.z), 1);
  const cableLine = META.cable, stTopAny = nearest(cableLine[cableLine.length - 1][0], cableLine[cableLine.length - 1][1], 80, false);

  const stations = [nearest(cableLine[0][0], cableLine[0][1], 80, true), nearest(cableLine[cableLine.length - 1][0], cableLine[cableLine.length - 1][1], 80, true)];

  // ---------------------------------------------------------------- game state
  const game = { found: new Set(), cats: new Set(), dogs: new Set(), errands: {}, hour: 9, t: 0 };
  const P = { x: startC.x, z: startC.z, y: 0, heading: 2.1, phase: 0, moving: 0, path: null, pi: 0, ride: null, type: 0, seed: 0, scale: 1.12 };
